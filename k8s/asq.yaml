apiVersion: apps/v1
kind: Deployment
metadata:
  name: asq
spec:
  replicas: 1
  selector:
    matchLabels:
      app: asq
  template:
    metadata:
      labels:
        app: asq
    spec:
      enableServiceLinks: false
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: localhost:5000/asq
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: http
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: web
spec:
  type: LoadBalancer
  loadBalancerSourceRanges:
    - 192.168.86.0/24
    - 10.0.0.0/24
  selector:
    app: asq
  ports:
    - name: http
      port: 8082
      targetPort: http
